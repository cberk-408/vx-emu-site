<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e879f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background hexagon -->
  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.4"/>
  <!-- Inner hexagon -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="url(#grad1)" opacity="0.15"/>
  <!-- N letter -->
  <path d="M65,130 L65,70 L100,110 L100,70 L100,130" fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Accent dot -->
  <circle cx="140" cy="75" r="6" fill="url(#grad1)" filter="url(#glow)"/>
  <!-- Decorative lines -->
  <line x1="120" y1="90" x2="155" y2="90" stroke="url(#grad2)" stroke-width="2" opacity="0.5"/>
  <line x1="120" y1="100" x2="145" y2="100" stroke="url(#grad2)" stroke-width="2" opacity="0.3"/>
  <line x1="120" y1="110" x2="150" y2="110" stroke="url(#grad2)" stroke-width="2" opacity="0.4"/>
</svg>
